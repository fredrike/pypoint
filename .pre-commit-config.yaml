default_language_version:
    python: python3.12
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.1
    hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
  - repo: https://github.com/pycqa/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        additional_dependencies:
        - aiohttp
        exclude: 'tests/'
        args:
        - --ignore=setup.py
